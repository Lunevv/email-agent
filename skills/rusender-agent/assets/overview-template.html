<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Обзор проектов</title>
<!--
  Шаблон сводки по всем проектам для навыка rusender-agent.

  Как использовать: получить данные командой
      node scripts/overview.mjs --json
  и подставить их в <script id="overview-data">. Разметку и стили не менять —
  они рассчитаны на то, что проектов от одного до пары десятков.

  Цвет статуса берётся из flags: есть warn — красный, только note — жёлтый,
  пусто — зелёный. Порядок карточек задаёт скрипт: требующие внимания первыми.
-->
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#16181d; --muted:#6b7280; --line:#e5e7eb;
    --ok:#15803d; --ok-bg:#dcfce7; --warn:#b45309; --warn-bg:#fef3c7;
    --bad:#b91c1c; --bad-bg:#fee2e2; --accent:#4b4afb;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
    :root{ --bg:#0e1015; --card:#171a21; --ink:#e8eaf0; --muted:#9aa1ad; --line:#252a33;
           --ok:#4ade80; --ok-bg:#14301f; --warn:#fbbf24; --warn-bg:#332506;
           --bad:#f87171; --bad-bg:#3a1414; --accent:#8b8aff; }
  }}
  :root[data-theme="dark"]{ --bg:#0e1015; --card:#171a21; --ink:#e8eaf0; --muted:#9aa1ad;
    --line:#252a33; --ok:#4ade80; --ok-bg:#14301f; --warn:#fbbf24; --warn-bg:#332506;
    --bad:#f87171; --bad-bg:#3a1414; --accent:#8b8aff; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 16px 56px}
  header{margin-bottom:24px}
  h1{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px}
  .tally{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;
        padding:7px 15px;font-size:13px;display:flex;gap:7px;align-items:baseline}
  .pill b{font-size:17px;font-variant-numeric:tabular-nums}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:17px 18px;border-left:4px solid var(--line)}
  .card[data-state="bad"]{border-left-color:var(--bad)}
  .card[data-state="warn"]{border-left-color:var(--warn)}
  .card[data-state="ok"]{border-left-color:var(--ok)}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .name{font-weight:640;font-size:16px}
  .when{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .metrics{display:flex;gap:22px;margin:14px 0 4px;align-items:flex-end}
  .m{display:flex;flex-direction:column;gap:2px}
  .m .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .m .val{font-size:21px;font-weight:620;font-variant-numeric:tabular-nums;line-height:1.1}
  .m .val.dim{color:var(--muted);font-weight:500;font-size:17px}
  .delta{font-size:12.5px;font-weight:600;padding-bottom:3px}
  .delta.up{color:var(--ok)} .delta.down{color:var(--bad)} .delta.flat{color:var(--muted)}
  .bar{height:5px;border-radius:3px;background:var(--line);margin:11px 0 3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .flags{margin:13px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .flags li{font-size:13px;padding:5px 10px;border-radius:7px;line-height:1.4}
  .flags li[data-level="warn"]{background:var(--bad-bg);color:var(--bad)}
  .flags li[data-level="note"]{background:var(--warn-bg);color:var(--warn)}
  .clean{font-size:13px;color:var(--ok);background:var(--ok-bg);
         padding:5px 10px;border-radius:7px;display:inline-block;margin-top:13px}
  footer{margin-top:30px;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Обзор проектов</h1>
    <div class="sub" id="sub"></div>
  </header>
  <div class="tally" id="tally"></div>
  <div class="grid" id="grid"></div>
  <footer id="foot"></footer>
</div>

<script id="overview-data" type="application/json">
{"root":"projects","generatedAt":"","projects":[]}
</script>

<script>
(function(){
  var d = JSON.parse(document.getElementById('overview-data').textContent);
  var P = d.projects || [];
  var pct = function(x){ return (x===null||x===undefined) ? '—'
    : (x*100).toFixed(1).replace('.',',')+'%'; };
  var when = function(n){ return n===null||n===undefined ? 'отправок не было'
    : n===0 ? 'сегодня' : n===1 ? 'вчера' : n+' дн. назад'; };
  var state = function(p){
    var f = p.flags||[];
    if (f.some(function(x){return x.level==='warn';})) return 'bad';
    return f.length ? 'warn' : 'ok';
  };

  var bad = P.filter(function(p){return state(p)==='bad';}).length;
  var note = P.filter(function(p){return state(p)==='warn';}).length;
  var ok = P.length - bad - note;

  document.getElementById('sub').textContent =
    'Память: ' + d.root + (d.generatedAt ? ' · собрано ' + d.generatedAt.slice(0,10) : '');

  document.getElementById('tally').innerHTML =
    '<span class="pill"><b>'+P.length+'</b> проектов</span>' +
    '<span class="pill" style="color:var(--bad)"><b>'+bad+'</b> требуют внимания</span>' +
    '<span class="pill" style="color:var(--warn)"><b>'+note+'</b> есть заметки</span>' +
    '<span class="pill" style="color:var(--ok)"><b>'+ok+'</b> без замечаний</span>';

  document.getElementById('grid').innerHTML = P.map(function(p){
    var st = state(p);
    var delta = '';
    if (p.or != null && p.medianOr) {
      var diff = (p.or - p.medianOr) / p.medianOr;
      // красим красным только то, что действительно помечено предупреждением
      // (порог тот же, что у флага: ниже медианы на 15% и больше), иначе серым —
      // чтобы зелёная карточка не соседствовала с красной цифрой
      if (Math.abs(diff) >= 0.02) {
        var cls = diff > 0 ? 'up' : (diff <= -0.15 ? 'down' : 'flat');
        delta = '<span class="delta ' + cls + '">' +
          (diff>0?'+':'−') + Math.abs(Math.round(diff*100)) + '%</span>';
      }
    }
    var barW = (p.or != null && p.medianOr)
      ? Math.max(4, Math.min(100, Math.round(p.or / Math.max(p.or, p.medianOr) * 100))) : 0;
    var flags = (p.flags||[]).map(function(f){
      return '<li data-level="'+f.level+'">'+f.text+'</li>'; }).join('');
    return '<article class="card" data-state="'+st+'">' +
      '<div class="top"><span class="name">'+(p.name||p.slug)+'</span>' +
      '<span class="when">'+when(p.daysAgo)+'</span></div>' +
      '<div class="metrics">' +
        '<div class="m"><span class="lbl">OR</span><span class="val">'+pct(p.or)+'</span></div>' +
        '<div class="m"><span class="lbl">медиана серии</span>' +
          '<span class="val dim">'+pct(p.medianOr)+(p.seriesN?' <span style="font-size:12px">('+p.seriesN+')</span>':'')+'</span></div>' +
        delta +
      '</div>' +
      (barW ? '<div class="bar"><i style="width:'+barW+'%"></i></div>' : '') +
      (flags ? '<ul class="flags">'+flags+'</ul>'
             : '<span class="clean">без замечаний</span>') +
    '</article>';
  }).join('');

  document.getElementById('foot').textContent =
    'OR сравнивается с медианой сопоставимой серии того же проекта: та же аудитория, ' +
    'та же роль отправки, та же языковая версия. В скобках — сколько рассылок в серии. ' +
    'Проекты между собой не сравниваются.';
})();
</script>
</body>
</html>
